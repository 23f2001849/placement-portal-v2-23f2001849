swagger: "2.0"
info:
  title: Placement Portal V2 API
  description: API documentation for Placement Portal V2 - MAD-II Jan 2026
  version: "1.0"

host: localhost:5000
basePath: /
schemes:
  - http

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: "JWT token. Format: Bearer <token>"

paths:
  /api/register/student:
    post:
      tags:
        - Auth
      summary: Register a new student account
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - email
              - password
              - name
            properties:
              email:
                type: string
                example: student@college.edu
              password:
                type: string
                example: secret123
              name:
                type: string
                example: Krishna Kumar
      responses:
        201:
          description: Student registered successfully
        400:
          description: Missing fields or invalid input
        409:
          description: Email already registered

  /api/register/company:
    post:
      tags:
        - Auth
      summary: Register a new company account
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - email
              - password
              - name
            properties:
              email:
                type: string
                example: hr@company.com
              password:
                type: string
                example: secret123
              name:
                type: string
                example: Infosys Ltd
      responses:
        201:
          description: Company registered, pending admin approval
        400:
          description: Missing fields or invalid input
        409:
          description: Email already registered

  /api/login:
    post:
      tags:
        - Auth
      summary: Login and receive JWT tokens
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                example: admin@gmail.com
              password:
                type: string
                example: admin
      responses:
        200:
          description: Login successful, returns access and refresh tokens
        401:
          description: Invalid credentials
        403:
          description: Account blacklisted or company not approved

  /api/refresh:
    post:
      tags:
        - Auth
      summary: Get a new access token using refresh token
      security:
        - Bearer: []
      responses:
        200:
          description: Returns new access token
        401:
          description: Invalid or expired refresh token

  /api/logout:
    post:
      tags:
        - Auth
      summary: Logout and invalidate current access token
      security:
        - Bearer: []
      responses:
        200:
          description: Logged out successfully
        401:
          description: Missing or invalid token

  /api/me:
    get:
      tags:
        - Auth
      summary: Get current logged-in user info
      security:
        - Bearer: []
      responses:
        200:
          description: Returns user email and role
        401:
          description: Missing or invalid token

  /api/admin/dashboard:
    get:
      tags:
        - Admin
      summary: Get dashboard stats
      security:
        - Bearer: []
      responses:
        200:
          description: Total counts of students, companies, drives, applications

  /api/admin/companies:
    get:
      tags:
        - Admin
      summary: List all companies, filter by status
      security:
        - Bearer: []
      parameters:
        - in: query
          name: status
          type: string
          enum: [pending, approved, rejected]
      responses:
        200:
          description: List of companies

  /api/admin/companies/{company_id}/approve:
    put:
      tags:
        - Admin
      summary: Approve a company
      security:
        - Bearer: []
      parameters:
        - in: path
          name: company_id
          required: true
          type: integer
      responses:
        200:
          description: Company approved
        404:
          description: Company not found

  /api/admin/companies/{company_id}/reject:
    put:
      tags:
        - Admin
      summary: Reject a company
      security:
        - Bearer: []
      parameters:
        - in: path
          name: company_id
          required: true
          type: integer
      responses:
        200:
          description: Company rejected
        404:
          description: Company not found

  /api/admin/companies/{company_id}/blacklist:
    put:
      tags:
        - Admin
      summary: Blacklist a company and close all their drives
      security:
        - Bearer: []
      parameters:
        - in: path
          name: company_id
          required: true
          type: integer
      responses:
        200:
          description: Company blacklisted and drives closed
        404:
          description: Company not found

  /api/admin/students:
    get:
      tags:
        - Admin
      summary: List all students, searchable by name/roll/email
      security:
        - Bearer: []
      parameters:
        - in: query
          name: q
          type: string
      responses:
        200:
          description: List of students

  /api/admin/students/{student_id}/blacklist:
    put:
      tags:
        - Admin
      summary: Blacklist a student
      security:
        - Bearer: []
      parameters:
        - in: path
          name: student_id
          required: true
          type: integer
      responses:
        200:
          description: Student blacklisted
        404:
          description: Student not found

  /api/admin/drives:
    get:
      tags:
        - Admin
      summary: List all drives, filter by status
      security:
        - Bearer: []
      parameters:
        - in: query
          name: status
          type: string
          enum: [pending, approved, rejected, closed]
      responses:
        200:
          description: List of drives

  /api/admin/drives/{drive_id}/approve:
    put:
      tags:
        - Admin
      summary: Approve a pending drive
      security:
        - Bearer: []
      parameters:
        - in: path
          name: drive_id
          required: true
          type: integer
      responses:
        200:
          description: Drive approved
        400:
          description: Drive not in pending state
        404:
          description: Drive not found

  /api/admin/drives/{drive_id}/reject:
    put:
      tags:
        - Admin
      summary: Reject a pending drive
      security:
        - Bearer: []
      parameters:
        - in: path
          name: drive_id
          required: true
          type: integer
      responses:
        200:
          description: Drive rejected
        400:
          description: Drive not in pending state
        404:
          description: Drive not found

  /api/admin/applications:
    get:
      tags:
        - Admin
      summary: List all applications, filterable by drive or student
      security:
        - Bearer: []
      parameters:
        - in: query
          name: drive_id
          type: integer
        - in: query
          name: student_id
          type: integer
      responses:
        200:
          description: List of applications

  /api/company/dashboard:
    get:
      tags:
        - Company
      summary: Get company dashboard with own drives and applicant counts
      security:
        - Bearer: []
      responses:
        200:
          description: Dashboard data

  /api/company/profile:
    get:
      tags:
        - Company
      summary: Get own company profile
      security:
        - Bearer: []
      responses:
        200:
          description: Company profile
    put:
      tags:
        - Company
      summary: Update own company profile
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              name:
                type: string
              industry:
                type: string
              website:
                type: string
              hr_contact:
                type: string
              description:
                type: string
      responses:
        200:
          description: Profile updated

  /api/company/drives:
    get:
      tags:
        - Company
      summary: List own drives
      security:
        - Bearer: []
      responses:
        200:
          description: List of drives
    post:
      tags:
        - Company
      summary: Create a new placement drive
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - job_title
            properties:
              job_title:
                type: string
              job_description:
                type: string
              min_cgpa:
                type: number
              allowed_departments:
                type: string
              salary_range:
                type: string
              location:
                type: string
              application_deadline:
                type: string
      responses:
        201:
          description: Drive created
        400:
          description: Missing job_title

  /api/company/drives/{drive_id}:
    put:
      tags:
        - Company
      summary: Edit a pending drive
      security:
        - Bearer: []
      parameters:
        - in: path
          name: drive_id
          required: true
          type: integer
        - in: body
          name: body
          schema:
            type: object
      responses:
        200:
          description: Drive updated
        400:
          description: Drive not pending
        404:
          description: Drive not found

  /api/company/drives/{drive_id}/close:
    put:
      tags:
        - Company
      summary: Close an active drive
      security:
        - Bearer: []
      parameters:
        - in: path
          name: drive_id
          required: true
          type: integer
      responses:
        200:
          description: Drive closed
        404:
          description: Drive not found

  /api/company/drives/{drive_id}/applications:
    get:
      tags:
        - Company
      summary: List applications for own drive
      security:
        - Bearer: []
      parameters:
        - in: path
          name: drive_id
          required: true
          type: integer
      responses:
        200:
          description: List of applications
        404:
          description: Drive not found

  /api/company/applications/{application_id}/status:
    put:
      tags:
        - Company
      summary: Update application status with state machine enforcement
      security:
        - Bearer: []
      parameters:
        - in: path
          name: application_id
          required: true
          type: integer
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum: [shortlisted, selected, rejected]
              remark:
                type: string
      responses:
        200:
          description: Status updated
        400:
          description: Invalid transition
        403:
          description: Not your application
        404:
          description: Application not found

  /api/student/dashboard:
    get:
      tags:
        - Student
      summary: Get student dashboard stats
      security:
        - Bearer: []
      responses:
        200:
          description: Dashboard data

  /api/student/profile:
    get:
      tags:
        - Student
      summary: Get own student profile
      security:
        - Bearer: []
      responses:
        200:
          description: Student profile
    put:
      tags:
        - Student
      summary: Update own student profile
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              name:
                type: string
              roll_number:
                type: string
              department:
                type: string
              cgpa:
                type: number
              phone:
                type: string
              year_of_study:
                type: integer
              skills:
                type: string
              education:
                type: string
      responses:
        200:
          description: Profile updated

  /api/student/profile/resume:
    post:
      tags:
        - Student
      summary: Upload resume PDF (max 2MB)
      security:
        - Bearer: []
      consumes:
        - multipart/form-data
      parameters:
        - in: formData
          name: resume
          type: file
          required: true
      responses:
        200:
          description: Resume uploaded
        400:
          description: Invalid file

  /api/drives:
    get:
      tags:
        - Student
      summary: List approved drives with optional filters
      security:
        - Bearer: []
      parameters:
        - in: query
          name: q
          type: string
        - in: query
          name: department
          type: string
        - in: query
          name: min_cgpa
          type: number
      responses:
        200:
          description: List of approved drives

  /api/drives/{drive_id}:
    get:
      tags:
        - Student
      summary: Get drive detail
      security:
        - Bearer: []
      parameters:
        - in: path
          name: drive_id
          required: true
          type: integer
      responses:
        200:
          description: Drive detail
        404:
          description: Drive not found

  /api/student/applications:
    post:
      tags:
        - Student
      summary: Apply to a drive with eligibility check
      security:
        - Bearer: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - drive_id
            properties:
              drive_id:
                type: integer
      responses:
        201:
          description: Application submitted
        409:
          description: Already applied
        422:
          description: Eligibility check failed
        404:
          description: Drive not found
    get:
      tags:
        - Student
      summary: Get own application history
      security:
        - Bearer: []
      responses:
        200:
          description: List of applications
  